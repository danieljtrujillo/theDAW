[project]
name = "stable-audio-3"
version = "0.1.6"
description = "Stable Audio 3: A state-of-the-art open platform for fast, high-quality generated audio and music"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.2",
    "einops-exts>=0.0.4",
    "numpy>=2.2.6",
    "packaging>=26.0",
    "fastapi>=0.135.1",
    "uvicorn>=0.42.0",
    "python-multipart>=0.0.26",
    "matplotlib>=3.10.8",
    "pillow>=12.2.0",
    "soundfile>=0.12.0",
    "safetensors>=0.7.0",
    # torch from the cu130 index (see [tool.uv.sources]). torchaudio stopped
    # tracking torch at 2.11.0 (2026-03-23): it is the newest release anywhere,
    # declares no torch pin, and its notes say it works with future torch. The
    # app uses it for transforms only: from 2.9 its load()/save() go through
    # torchcodec, which needs FFmpeg's SHARED libraries at import (no ordinary
    # Windows ffmpeg has them), so audio I/O is backend/lib/audio_io.py on
    # libsndfile + the ffmpeg CLI instead.
    "torch==2.14.0",
    "torchaudio==2.11.0",
    "tqdm>=4.67.3",
    "huggingface-hub>=1.7.1",
    "transformers>=5.8.0",
    # RAG module deps — move these to backend/modules/rag/module.json deps
    # when RAG is extracted into the module system. backend/rag.py imports
    # chromadb at runtime; without it the server logs a non-fatal warning and
    # the assistant runs without document retrieval.
    "chromadb>=1.0.0",
    "sentence-transformers>=3.0.0",
    "httpx>=0.28.1",
    "psutil>=5.9.0",
    "librosa>=0.10.0",
    # edit-tool-stack (backend/modules/{mastering,restoration,enhance,creative_*,delivery,analyzer}):
    # scipy = linear-phase FIR design + dynamic-EQ DSP; pyloudnorm = pure-Python LUFS
    # cross-check used by the analyzer + metering (loudness itself comes from FFmpeg loudnorm).
    "scipy>=1.11",
    "pyloudnorm>=0.1.1",
    # basic-pitch's inference runtime. The GPU build carries the CUDA
    # execution provider (cuBLAS / cuDNN come from torch's wheel), so
    # audio-to-MIDI runs on the card next to Demucs and whisper instead of
    # on the CPU; macOS has no CUDA build.
    # on the CPU; macOS has no CUDA build. PyPI onnxruntime-gpu builds are
    # CUDA 13 from 1.27 on, which is what torch 2.14.0+cu130 bundles, and
    # 1.24+ ships cp311+ wheels only — both reasons this moved with Python.
    "onnxruntime>=1.29 ; sys_platform == 'darwin'",
    "onnxruntime-gpu>=1.29 ; sys_platform != 'darwin'",
    # Windows-only: a prebuilt FlashAttention-2 wheel per Python minor (the
    # URLs live in [tool.uv.sources]). Pinned here so `uv sync` never removes
    # it. On Windows this package is the ONLY FlashAttention-2 there is —
    # torch's built-in flash SDPA kernel is not compiled under MSVC — so
    # Ampere+ users would lose it without this line; transformer.py gates it
    # off on pre-Ampere cards (sm < 8) either way.
    "flash-attn ; sys_platform == 'win32' and python_version < '3.15'",
    "aubio>=0.4.9",
    "mutagen>=1.47",
    # midi module (backend/modules/midi) — audio→MIDI transcription + export.
    # These were installed manually but undeclared, so `uv sync` pruned them and
    # broke the MIDI module; declared here so the working set is stable.
    "basic-pitch>=0.4.0",
    # No setuptools pin. One used to sit here (<81) to keep `pkg_resources`
    # shipping for resampy 0.4.2; resampy 0.4.3 dropped that import, and the
    # override-dependencies entry under [tool.uv] is what lets it resolve.
    # Piano-roll transcription engine (the midi module's second engine beside
    # basic-pitch). Downloads its checkpoint (~165 MB) to ~/piano_transcription
    # on first use.
    "piano-transcription-inference>=0.0.5",
    "pretty_midi>=0.2.11",
    "mido>=1.3.3",
    # notation module — symbolic music conversion / analysis backbone.
    "music21>=9.7.1,<10.3.0",
    "partitura>=1.9.0",
    # controllervision module — classical CV (Hough/contours) to infer a MIDI
    # controller's layout from a product photo. Headless (no GUI libs). The
    # module guards its import, so the backend still boots if this is absent.
    "opencv-python-headless>=4.9.0",
    # ytimport module (backend/modules/ytimport) — paste a URL (YouTube,
    # SoundCloud, Bandcamp, …) and pull the best audio via yt-dlp. Date-versioned
    # and updated often as site extractors change; keep a generous floor and let
    # `uv sync` pull the newest so YouTube/SoundCloud keep working.
    "yt-dlp>=2025.1.1",
    # akvj native Kinect point cloud (backend/modules/akvj/kinect_sidecar.py).
    # pyk4a-bundle ships its OWN matched k4a.dll + depthengine, so no separate
    # Azure Kinect SDK install is needed; the sidecar just works. Windows x64 +
    # Linux x64 only (no macOS wheel), gated so `uv sync` skips it elsewhere.
    # websockets is the sidecar's WebSocket client to the relay.
    "pyk4a-bundle ; (sys_platform == 'win32') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
    "websockets>=12.0",
    # --- VST / DAW import / .tasmo project format (June 2026) ---
    # VST3 plugin hosting via pedalboard (Spotify). JUCE-based, VST3+AudioUnit,
    # GPL-3.0 (compatible with open-source theDAW). Windows/macOS/Linux.
    "pedalboard>=0.9.23",
    # Reaper .RPP project file parsing. MIT licensed.
    "reaproj>=0.1.0",
    # Binary serialization for .tasmo project files (MsgPack + ZIP).
    "msgpack>=1.2.1",
    # FL Studio .flp project parsing (Image-Line NEM binary format). PyPI.
    "pyflp>=2.0.0",
    # lyricanalysis module (backend/modules/lyricanalysis) — the CMU
    # Pronouncing Dictionary behind the rhyme/assonance detectors. The module
    # guards its import and falls back to its own letter-to-sound rules, so
    # the backend still boots if this is absent.
    "cmudict>=1.0.0",
]

[project.optional-dependencies]
# accelerate is an optional Hugging Face acceleration extra. The legacy gradio
# UI (run_gradio.py + interface/diffusion_cond.py) was removed in a CVE sweep;
# the React + FastAPI app does not use gradio.
ui = [
  "accelerate>=1.13.0",
]

lora = [
  "pytorch_lightning==2.6.5",
  "dill>=0.4.1",
]

server = [
  "fastapi>=0.115.0",
  "uvicorn>=0.34.0",
  "httpx>=0.28.0",
  "python-multipart>=0.0.20",
]

[[tool.uv.index]]
# torch 2.14.0 is published for cu126, cu130 and cu132 only. cu130 is the one
# strictly-upward path from the previous cu128 (CUDA 12.8 -> 13.0, cuDNN 9.7 ->
# 9.24); it needs an NVIDIA driver >= 580 (R580+) and keeps Turing (sm_75)
# through Blackwell. One index for every platform, so the CUDA-13 build of
# onnxruntime-gpu stays coherent on Linux GPU hosts too.
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
flash-attn = [
  { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.10.2/flash_attn-2.8.3%2Bcu130torch2.14-cp312-cp312-win_amd64.whl", marker = "sys_platform == 'win32' and python_version == '3.12'" },
  { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.10.2/flash_attn-2.8.3%2Bcu130torch2.14-cp313-cp313-win_amd64.whl", marker = "sys_platform == 'win32' and python_version == '3.13'" },
  { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.10.2/flash_attn-2.8.3%2Bcu130torch2.14-cp314-cp314-win_amd64.whl", marker = "sys_platform == 'win32' and python_version == '3.14'" },
]
# aubio ships NO wheels on PyPI (source-only since 0.4.9 in 2019) and its 2019 C
# source does not compile on a stock machine (no MSVC on Windows; the aubio#402
# const-pointer mismatch is a hard error on modern clang/gcc). Pin a prebuilt
# cp312 wheel per shipped platform so aubio stays a first-class dependency and
# installs with no compiler anywhere. The mac arm64 and linux x86_64 wheels are
# built by .github/workflows/build-aubio-wheels.yml (cibuildwheel against NumPy
# 2.x); the Windows wheel is built the same way. Platforms without a wheel here
# (e.g. linux aarch64) fall back to the PyPI sdist.
aubio = [
  { path = "wheels/aubio-0.4.9-cp312-cp312-win_amd64.whl", marker = "sys_platform == 'win32'" },
  { path = "wheels/aubio-0.4.9-cp312-cp312-macosx_11_0_arm64.whl", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
  { path = "wheels/aubio-0.4.9-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
  { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
  { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
]
[tool.uv]
# basic-pitch 0.4.0 caps resampy at <0.4.3, but 0.4.3 is exactly the release
# that dropped the deprecated `pkg_resources` import (its only change of note),
# and setuptools >= 81 no longer ships pkg_resources at all. Overriding the cap
# is what lets setuptools float instead of being pinned to a 2025 release.
override-dependencies = [
  "resampy>=0.4.3",
  # basic-pitch 0.4.0 also requires tensorflow<2.15.1 on Python >= 3.11
  # (non-mac), tensorflow-macos on mac and tflite-runtime on Linux < 3.11.
  # No TensorFlow below 2.16 has cp312 wheels, and all of them cap
  # protobuf < 5 — and the app never used that path: the midi engine drives
  # basic-pitch's bundled ONNX model through onnxruntime(-gpu), a direct
  # dependency on every platform, and basic-pitch itself falls through to
  # ONNX when TF/CoreML/TFLite do not import. A never-true marker removes each
  # from resolution (the idiom uv's maintainers endorse for dropping a
  # transitive dependency; `exclude-dependencies` needs uv >= 0.11).
  "tensorflow ; python_version < '0'",
  "tensorflow-macos ; python_version < '0'",
  "tensorflow-estimator ; python_version < '0'",
  "keras ; python_version < '0'",
  "tensorboard ; python_version < '0'",
  "tensorboard-data-server ; python_version < '0'",
  "tflite-runtime ; python_version < '0'",
  # chromadb requires plain onnxruntime everywhere. It and onnxruntime-gpu
  # unpack into the same onnxruntime/ directory and whichever installs last
  # wins — the CPU build was overwriting the CUDA one. The GPU build provides
  # the import chromadb needs, so the CPU package is confined to macOS.
  "onnxruntime>=1.29 ; sys_platform == 'darwin'",
]
# Needed because the PyTorch CUDA index pins some packages (e.g. certifi) at
# older versions than PyPI. Without this flag uv refuses to install them.
index-strategy = "unsafe-best-match"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  # starlette >= 1.2 prefers httpx2 for its TestClient and warns when only
  # httpx is present; httpx2 is the successor line and coexists with httpx.
  "httpx2>=2.12.0",
    "pytest>=9.0.3",
    # 🚨 HARD RULE: ruff is pinned EXACTLY. The same version literal also
    # appears in .github/workflows/lint.yml as the `RUFF_VERSION` env var.
    # Bumping ruff REQUIRES updating BOTH places in the same commit and
    # running `uv sync --group dev` + `uv run ruff format .` in that same
    # commit. Never run a different ruff (global pip, pipx, system) against
    # this repo — version drift silently corrupts formatting. See CLAUDE.md
    # → "🚨 HARD RULES" for the full rule.
    "ruff==0.15.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude = [
    "stable_audio_3/models",
    "stable_audio_3/inference",
    "stable_audio_3/interface",
    "stable_audio_3/data",
    "stable_audio_3/training",
    # Vendored git submodule (third-party MRT2 port); not linted by the parent project.
    "sidecars/magenta-rt2-nvidia",
    # Vendored subrepo (dada-bots/underfit + local mods); keeps its own style,
    # not linted by the parent project — same policy as the MRT2 sidecar above.
    "underfit",
    # Runtime-created isolated venv for the faster-whisper transcription sidecar.
    "backend/modules/vocal/transcription/.whisper_venv",
    # Vendored stems-separation sidecar (Demucs/LARSNET server); runs in its own
    # venv with its own deps, keeps its own style — same policy as underfit.
    "integration-package",
]
