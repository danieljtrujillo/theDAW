<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Character FX — theDAW</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07080c;--panel:#0e1018;--surface:#141720;--border:#1e2230;
  --accent:#f59e0b;--accent-dim:rgba(245,158,11,.15);--accent-glow:rgba(245,158,11,.25);
  --text:#e0e6f0;--dim:#5a6278;--mono:"IBM Plex Mono",monospace;--sans:"IBM Plex Sans",sans-serif;
}
html,body{width:100%;height:100%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--sans);color:var(--text);overflow:hidden}
.module-frame{width:780px;max-width:780px;height:504px;max-height:504px;background:var(--panel);border:1px solid var(--border);border-radius:6px;display:flex;flex-direction:column;overflow:hidden}

/* ── HEADER 28px ── */
.hdr{display:flex;align-items:center;padding:0 10px;background:#0a0b10;border-bottom:1px solid #1a1d28;flex-shrink:0;height:28px;gap:8px}
.hdr-icon{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent-glow);flex-shrink:0}
.hdr-title{font:700 10px/1 var(--mono);letter-spacing:1.4px;text-transform:uppercase;color:#c8cad0}
.preset-nav{display:flex;align-items:center;gap:2px;margin-left:8px}
.preset-nav button{background:none;border:none;color:#5a5e6a;font-size:9px;cursor:pointer;padding:0 2px;font-family:var(--mono)}
.preset-nav button:hover{color:#a0a4b0}
.preset-name{font:500 8px/1 var(--mono);color:#6b7080;min-width:80px;text-align:center}
.hdr-spacer{flex:1}
.hdr-pill{font:600 7px/1 var(--mono);letter-spacing:.4px;padding:2px 7px;border-radius:3px;border:1px solid #22262e;background:#0c0e14;color:#3e4250;cursor:pointer;transition:all 120ms;user-select:none}
.hdr-pill:hover{border-color:#3a3e4a;color:#8890a0}
.hdr-pill.active{background:#1a1508;border-color:var(--accent);color:var(--accent)}

/* ── TOP BAR: CHARACTER RESPONSE tabs + toggles ── */
.top-bar{display:flex;align-items:center;padding:3px 10px;background:#090b10;border-bottom:1px solid var(--border);flex-shrink:0;height:24px;gap:6px}
.top-tab{font:700 7px/1 var(--mono);letter-spacing:.8px;text-transform:uppercase;color:var(--dim);cursor:pointer;padding:2px 6px;border-radius:3px;transition:.15s;display:flex;align-items:center;gap:4px;user-select:none}
.top-tab:hover{color:var(--text)}
.top-tab.active{color:var(--accent)}
.top-tab .dot{width:5px;height:5px;border-radius:50%;background:var(--dim);transition:.15s}
.top-tab.active .dot{background:var(--accent);box-shadow:0 0 4px var(--accent-glow)}
.top-spacer{flex:1}
.view-tog{font:600 6.5px/1 var(--mono);letter-spacing:.5px;padding:2px 6px;border-radius:3px;border:1px solid var(--border);background:none;color:var(--dim);cursor:pointer;transition:.15s;user-select:none}
.view-tog:hover{color:var(--text)}
.view-tog.on{color:var(--accent);border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.04)}

/* ── SPECTRUM CANVAS (40%) ── */
.spectrum-zone{height:36%;position:relative;background:#040610;border-bottom:1px solid var(--border);flex-shrink:0;overflow:hidden}
.spectrum-zone canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
.freq-axis{position:absolute;left:2px;top:0;bottom:0;width:24px;display:flex;flex-direction:column;justify-content:space-between;padding:6px 0;pointer-events:none}
.freq-axis span{font:600 5.5px/1 var(--mono);color:rgba(255,255,255,.08);text-align:right}
.db-axis{position:absolute;right:2px;top:0;bottom:0;width:20px;display:flex;flex-direction:column;justify-content:space-between;padding:6px 0;pointer-events:none}
.db-axis span{font:600 5px/1 var(--mono);color:rgba(255,255,255,.06);text-align:left}
/* Harmonics bar cluster overlay */
.harmonics-overlay{position:absolute;top:8px;right:30px;display:flex;gap:1px;align-items:flex-end;height:40px;pointer-events:none}
.harm-bar{width:4px;border-radius:1px 1px 0 0;background:var(--accent);opacity:.7;transition:height .15s}

/* ── MODE SELECTOR ROW ── */
.mode-row{display:flex;align-items:center;padding:4px 10px;flex-shrink:0;height:30px;gap:6px;background:#090b10;border-bottom:1px solid var(--border)}
.mode-label{font:700 7px/1 var(--mono);letter-spacing:.8px;color:var(--dim);text-transform:uppercase;margin-right:4px}
.mode-pill{font:700 7.5px/1 var(--mono);letter-spacing:.4px;padding:3px 10px;border-radius:4px;border:1px solid var(--border);background:none;color:var(--dim);cursor:pointer;transition:.15s;user-select:none}
.mode-pill:hover{border-color:rgba(255,255,255,.12);color:var(--text)}
.mode-pill.active{background:rgba(245,158,11,.08);border-color:var(--accent);color:var(--accent);box-shadow:0 0 8px rgba(245,158,11,.1)}
.mode-spacer{flex:1}
.style-label{font:600 6.5px/1 var(--mono);letter-spacing:.5px;color:var(--dim);text-transform:uppercase;margin-right:4px}
.style-select{font:600 8px/1 var(--mono);padding:3px 8px;border-radius:4px;border:1px solid var(--border);background:#0e1018;color:var(--text);cursor:pointer;appearance:none;-webkit-appearance:none;outline:none;min-width:90px}
.style-select:focus{border-color:var(--accent)}

/* ── KNOBS + FADERS AREA ── */
.controls-area{flex:1;display:flex;min-height:0;padding:4px 6px;gap:4px}

/* Left vertical fader section */
.fader-section{width:62px;display:flex;flex-direction:column;gap:3px;flex-shrink:0}
.fader-card{flex:1;background:#080a12;border:1px solid var(--border);border-radius:5px;display:flex;flex-direction:column;align-items:center;padding:4px 3px 3px;gap:1px;min-height:0}
.fc-label{font:700 5.5px/1 var(--mono);letter-spacing:.8px;text-transform:uppercase;color:var(--dim)}
.fc-rail{flex:1;width:10px;background:rgba(255,255,255,.02);border-radius:5px;position:relative;cursor:pointer;border:1px solid rgba(255,255,255,.035);min-height:0;overflow:hidden}
.fc-fill{position:absolute;bottom:0;left:0;right:0;border-radius:0 0 5px 5px;pointer-events:none}
.fc-cap{position:absolute;left:50%;transform:translate(-50%,-50%);width:18px;height:6px;border-radius:2px;background:linear-gradient(180deg,#d0d4e0,#a0a6b6);box-shadow:0 1px 4px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.25);pointer-events:none;z-index:2}
.fc-val{font:700 13px/1.1 var(--mono);color:var(--accent)}
.fc-info{font:600 6px/1 var(--mono);color:var(--dim);letter-spacing:.3px}

/* Center knobs row */
.knobs-center{flex:1;display:flex;gap:12px;align-items:center;justify-content:center;min-height:0}
.knob-slot{display:flex;flex-direction:column;align-items:center;gap:2px}
.k-lbl{font:700 10px/1 var(--mono);letter-spacing:.8px;text-transform:uppercase;color:var(--dim)}
.knob-slot svg{width:64px;height:64px;cursor:pointer;display:block}
.k-val{font:700 13px/1 var(--mono);color:var(--text)}
.k-unit{font:500 7px/1 var(--mono);color:var(--dim)}

/* Right section: vertical output fader */
.output-fader{width:50px;display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0}
.of-label{font:700 6px/1 var(--mono);letter-spacing:.8px;text-transform:uppercase;color:var(--dim)}
.of-rail{flex:1;width:10px;background:rgba(255,255,255,.02);border-radius:5px;position:relative;cursor:pointer;border:1px solid rgba(255,255,255,.035);min-height:0;overflow:hidden}
.of-fill{position:absolute;bottom:0;left:0;right:0;border-radius:0 0 5px 5px;pointer-events:none}
.of-cap{position:absolute;left:50%;transform:translate(-50%,-50%);width:18px;height:6px;border-radius:2px;background:linear-gradient(180deg,#d0d4e0,#a0a6b6);box-shadow:0 1px 4px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.25);pointer-events:none;z-index:2}
.of-val{font:700 13px/1.1 var(--mono);color:var(--text)}
.of-db{font:500 6px/1 var(--mono);color:var(--dim)}

/* Meter bars (SG/SIG) */
.meter-strip{display:flex;gap:3px;margin-top:auto}
.ms-col{display:flex;flex-direction:column;align-items:center;gap:1px}
.ms-lbl{font:700 5px/1 var(--mono);letter-spacing:.5px;color:var(--dim);text-transform:uppercase}
.ms-bar{width:6px;height:30px;background:rgba(255,255,255,.02);border-radius:3px;position:relative;border:1px solid rgba(255,255,255,.03);overflow:hidden}
.ms-fill{position:absolute;bottom:0;left:0;right:0;border-radius:0 0 3px 3px;transition:height .08s}

/* ── FOOTER 28px ── */
.ftr{display:flex;align-items:center;gap:6px;padding:0 8px;background:#08090e;border-top:1px solid var(--border);flex-shrink:0;height:28px}
.ftr-btn{font:600 7.5px/1 var(--mono);padding:2px 8px;border-radius:3px;border:1px solid #22262e;background:#0c0e14;color:#6b7080;cursor:pointer;transition:.15s;user-select:none}
.ftr-btn:hover{background:#14171e;color:#c8cad0}
.ftr-btn.active{background:#1a1508;border-color:var(--accent);color:var(--accent)}
.ftr-spacer{flex:1}
.ftr-stat{font:500 7.5px/1 var(--mono);color:var(--dim)}
.ftr-stat.ok{color:#22c55e}
.knob-slot.k-preview .k-lbl{color:#7a8196}
.knob-slot.k-preview .k-unit{color:#3e4250;letter-spacing:.6px;text-transform:uppercase}
.knob-svg:focus-visible,.fc-rail:focus-visible,.of-rail:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
audio{display:none}input[type="file"]{display:none}
</style>
</head>
<body>
<div class="module-frame">

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-icon"></div>
  <span class="hdr-title">Character FX</span>
  <div class="preset-nav">
    <button>&#9666;</button>
    <span class="preset-name" id="presetName">Warm Tape Drive</span>
    <button>&#9656;</button>
  </div>
  <span class="hdr-spacer"></span>
  <button class="hdr-pill" id="btnA">A</button>
  <button class="hdr-pill active" id="btnB">B</button>
  <button class="hdr-pill" id="btnCopy">Copy</button>
  <button class="hdr-pill" id="btnDelta">Delta</button>
</div>

<!-- TOP BAR: CHARACTER RESPONSE tabs -->
<div class="top-bar">
  <div class="top-tab active" data-tab="response"><span class="dot"></span>CHARACTER RESPONSE</div>
  <span class="top-spacer"></span>
  <button class="view-tog on" id="togView">View</button>
  <button class="view-tog" id="togHarmonics">Harmonics</button>
</div>

<!-- SPECTRUM CANVAS (40%) -->
<div class="spectrum-zone" id="specZone">
  <canvas id="specCanvas"></canvas>
  <div class="freq-axis"><span>20k</span><span>10k</span><span>5k</span><span>2k</span><span>1k</span><span>500</span><span>100</span><span>20</span></div>
  <div class="db-axis"><span>+12</span><span>+6</span><span>0</span><span>-6</span><span>-12</span><span>-18</span><span>-24</span></div>
  <div class="harmonics-overlay" id="harmOverlay"></div>
</div>

<!-- MODE SELECTOR ROW: one pill per backend Character-FX macro -->
<div class="mode-row" role="group" aria-label="Character mode">
  <span class="mode-label">MODE</span>
  <button class="mode-pill active" data-mode="tape" title="Broken Tape — wow + tilt">Tape</button>
  <button class="mode-pill" data-mode="ghost" title="Ghost Voice — ghostiness + size">Ghost</button>
  <button class="mode-pill" data-mode="radio" title="Radio Room — distance, muffle, room">Radio</button>
  <button class="mode-pill" data-mode="alien" title="Alien Transmission — mod + speed">Alien</button>
  <button class="mode-pill" data-mode="tunnel" title="Tunnel PA — harsh + distance">Tunnel</button>
  <span class="mode-spacer"></span>
  <label class="style-label" for="styleSel">STYLE</label>
  <select class="style-select" id="styleSel" name="styleSel" title="Style presets — set the knobs for this mode"></select>
</div>

<!-- CONTROLS AREA: faders + knobs -->
<div class="controls-area">

  <!-- LEFT: BIAS fader (preview saturation bias) + SG/SIG meters -->
  <div class="fader-section">
    <div class="fader-card">
      <div class="fc-label" id="biasLabel" title="Preview-only: asymmetric saturation bias on the live monitor">BIAS</div>
      <div class="fc-rail" id="biasTrack">
        <div class="fc-fill" id="biasFill" style="height:55%;background:linear-gradient(to top,rgba(245,158,11,.05),rgba(245,158,11,.55))"></div>
        <div class="fc-cap" id="biasCap" style="bottom:55%"></div>
      </div>
      <div class="fc-val" id="biasVal">+1.2 dB</div>
    </div>
    <div class="meter-strip">
      <div class="ms-col">
        <div class="ms-lbl">SG</div>
        <div class="ms-bar"><div class="ms-fill" id="sgFill" style="height:35%;background:linear-gradient(to top,rgba(245,158,11,.1),var(--accent))"></div></div>
      </div>
      <div class="ms-col">
        <div class="ms-lbl">SIG</div>
        <div class="ms-bar"><div class="ms-fill" id="sigFill" style="height:50%;background:linear-gradient(to top,rgba(245,158,11,.1),var(--accent))"></div></div>
      </div>
    </div>
  </div>

  <!-- CENTER: the mode's backend knobs (slot i posts BACKEND_KNOBS[effect][i]) + a preview Mix -->
  <div class="knobs-center" id="knobsRow">
    <div class="knob-slot"><div class="k-lbl" id="kl0">Wow</div><svg viewBox="0 0 52 52" class="knob-svg" data-idx="0"></svg><div class="k-val" id="kv0">50%</div><div class="k-unit" id="ku0">%</div></div>
    <div class="knob-slot"><div class="k-lbl" id="kl1">Tilt</div><svg viewBox="0 0 52 52" class="knob-svg" data-idx="1"></svg><div class="k-val" id="kv1">50%</div><div class="k-unit" id="ku1">%</div></div>
    <div class="knob-slot"><div class="k-lbl" id="kl2">—</div><svg viewBox="0 0 52 52" class="knob-svg" data-idx="2"></svg><div class="k-val" id="kv2">50%</div><div class="k-unit" id="ku2">%</div></div>
    <div class="knob-slot k-preview"><div class="k-lbl" id="kl3">Mix</div><svg viewBox="0 0 52 52" class="knob-svg" data-idx="3"></svg><div class="k-val" id="kv3">70%</div><div class="k-unit" id="ku3">preview</div></div>
  </div>

  <!-- RIGHT: Output fader (preview monitor level) -->
  <div class="output-fader">
    <div class="of-label" id="outLabel" title="Preview-only: monitor level of the live preview">OUTPUT</div>
    <div class="of-rail" id="outTrack">
      <div class="of-fill" id="outFill" style="height:70%;background:linear-gradient(to top,rgba(245,158,11,.05),rgba(245,158,11,.55))"></div>
      <div class="of-cap" id="outCap" style="bottom:70%"></div>
    </div>
    <div class="of-val" id="outVal">-0.8 dB</div>
    <div class="of-db">dB</div>
  </div>
</div>

<!-- FOOTER -->
<div class="ftr">
  <button class="ftr-btn" id="btnBypass" title="Bypass the live preview (dry)">Bypass</button>
  <button class="ftr-btn active" id="btnCharFx">Character FX</button>
  <button class="ftr-btn" id="btnAnalyzer">Analyzer</button>
  <button class="ftr-btn" id="btnPrePost" title="Analyzer taps the input (pre) or the processed preview (post)">Pre/Post</button>
  <button class="ftr-btn" id="btnProcess" style="margin-left:6px;border-color:var(--accent);color:var(--accent)" title="Render this mode's macro on the backend">PROCESS</button>
  <button class="ftr-btn" id="btnLoad" title="Load an audio file">Load</button>
  <span class="ftr-spacer"></span>
  <span class="ftr-stat" id="status" aria-live="polite">ready</span>
  <audio id="ain" controls></audio>
  <audio id="aout" controls></audio>
</div>
<input type="file" id="fileinput" name="fileinput" accept="audio/*" aria-label="Load audio file">
</div>

<script src="module-kit.js"></script>
<script>
/* ───────────────────────────────────────────────── */
/*  Character FX — Pro-grade module                  */
/*  One mode per backend macro (creative_fx MACROS). */
/* ───────────────────────────────────────────────── */

const ACCENT = '#f59e0b';
const kit = window.theDAWKit;

/* ── BACKEND CONTRACT ──
   MODE_TO_EFFECT maps a mode pill to its /api/edit/creative-fx tool id, and
   BACKEND_KNOBS lists, per tool, the exact knob names the backend reads —
   knob slot i posts BACKEND_KNOBS[effect][i] (0..1). Both tables are checked
   against the backend spec by editModulesContract.test.ts (FX-001). */
const MODE_TO_EFFECT = { tape: 'broken_tape', ghost: 'ghost_voice', radio: 'radio_room', alien: 'alien_transmission', tunnel: 'tunnel_pa' };
const BACKEND_KNOBS = { broken_tape: ['wow', 'tilt'], ghost_voice: ['ghostiness', 'size'], radio_room: ['distance', 'muffle', 'room'], alien_transmission: ['mod', 'speed'], tunnel_pa: ['harsh', 'distance'] };
const MIX_SLOT = 3; // preview-only wet/dry knob (not part of the backend macro)

const pct = v => Math.round(v) + '%';
/* ── MODE CONFIG — labels/readouts per slot, style presets per mode ── */
const MODES = {
  tape:   { knobs: ['Wow', 'Tilt', null, 'Mix'], units: ['flutter', 'dark', '', 'preview'],
            fmt: [v => (v / 100 * 5 + 1).toFixed(1) + ' Hz', v => '-' + (v / 100 * 6).toFixed(1) + ' dB', pct, pct],
            defaults: [50, 50, 0, 70],
            styles: [['Warm 2" Tape', [30, 25]], ['Hot 1/2" Tape', [45, 40]], ['Cassette Lo-Fi', [70, 65]], ['Broken Reel', [95, 80]]] },
  ghost:  { knobs: ['Ghostiness', 'Size', null, 'Mix'], units: ['denoise + slow', 'echo', '', 'preview'],
            fmt: [pct, v => Math.round(60 + v / 100 * 900) + ' ms', pct, pct],
            defaults: [50, 50, 0, 70],
            styles: [['Whisper', [30, 20]], ['Haunting', [55, 55]], ['Crypt', [80, 85]], ['Other Side', [100, 100]]] },
  radio:  { knobs: ['Distance', 'Muffle', 'Room', 'Mix'], units: ['high-pass', 'low-pass', 'echo', 'preview'],
            fmt: [v => Math.round(300 + v / 100 * 400) + ' Hz', v => Math.round(4000 - v / 100 * 2500) + ' Hz', v => Math.round(20 + v / 100 * 120) + ' ms', pct],
            defaults: [50, 50, 50, 70],
            styles: [['Kitchen Radio', [30, 40, 35]], ['Walkie-Talkie', [70, 70, 20]], ['Next Room', [40, 60, 80]], ['Shortwave', [90, 90, 50]]] },
  alien:  { knobs: ['Mod', 'Speed', null, 'Mix'], units: ['vibrato', 'phaser', '', 'preview'],
            fmt: [v => (4 + v / 100 * 8).toFixed(1) + ' Hz', v => (0.2 + v / 100 * 3).toFixed(2) + ' Hz', pct, pct],
            defaults: [50, 50, 0, 70],
            styles: [['Faint Signal', [25, 30]], ['Transmission', [50, 50]], ['Abduction', [80, 75]], ['Mothership', [100, 100]]] },
  tunnel: { knobs: ['Harsh', 'Distance', null, 'Mix'], units: ['treble', 'echo', '', 'preview'],
            fmt: [v => '+' + (v / 100 * 6).toFixed(1) + ' dB', v => Math.round(80 + v / 100 * 400) + ' ms', pct, pct],
            defaults: [50, 50, 0, 70],
            styles: [['Subway', [40, 35]], ['Stadium PA', [60, 70]], ['Storm Drain', [80, 90]], ['Megaphone', [100, 20]]] },
};

let activeMode = 'tape';
let knobValues = [...MODES.tape.defaults];
let knobDrag = { active: false, idx: -1, startY: 0, startVal: 0 };
let biasAmt = 55, outAmt = 70;
let showHarmonics = false;
let bypassed = false, deltaMode = false, analyzerPost = true;
const abSlots = { A: null, B: null };
let activeSlot = 'B';

/* ── STATE ── */
let actx, analyser, source, inputFile, inputBuf;
const freqData = new Uint8Array(2048);
const timeData = new Float32Array(4096);
let liveNodes = [], liveOscs = [];
let dryGain, wetGain, outGain, preTap;

function backendKnobCount(mode) { return BACKEND_KNOBS[MODE_TO_EFFECT[mode]].length; }

/* Params posted to the backend: slot i -> BACKEND_KNOBS[effect][i], 0..1. */
function buildBackendParams(mode, kv) {
  const keys = BACKEND_KNOBS[MODE_TO_EFFECT[mode]];
  const out = {};
  keys.forEach((k, i) => { out[k] = Math.max(0, Math.min(1, kv[i] / 100)); });
  return out;
}

async function processAudio() {
  if (!inputFile) { setStatus('no audio loaded'); return; }
  const effectId = MODE_TO_EFFECT[activeMode];
  const params = buildBackendParams(activeMode, knobValues);
  const fd = new FormData();
  fd.append('audio', inputFile);
  fd.append('effect', effectId);
  fd.append('params', JSON.stringify(params));
  fd.append('output_format', 'wav');
  setStatus('processing ' + effectId + '...');
  const t0 = performance.now();
  try {
    const resp = await fetch('/api/edit/creative-fx/process', { method: 'POST', body: fd });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const blob = await resp.blob();
    document.getElementById('aout').src = URL.createObjectURL(blob);
    setStatus('done ' + (blob.size / 1024).toFixed(0) + 'KB ' + Math.round(performance.now() - t0) + 'ms', true);
    if (actx) {
      const decoded = await actx.decodeAudioData(await blob.arrayBuffer());
      connectBuf(decoded);
    }
  } catch (err) {
    setStatus('error: ' + err.message);
  }
}

function setStatus(text, ok) {
  const st = document.getElementById('status');
  st.className = 'ftr-stat' + (ok ? ' ok' : '');
  st.textContent = text;
}

/* ── STYLE PRESETS (per mode) ── */
const styleSel = document.getElementById('styleSel');
function fillStyles() {
  const cfg = MODES[activeMode];
  styleSel.innerHTML = '';
  cfg.styles.forEach(([name], i) => { const o = document.createElement('option'); o.value = String(i); o.textContent = name; styleSel.appendChild(o); });

/* ── AUDIO ── */
function ensureAudio(){
  if(actx) return;
  actx = new AudioContext();
  analyser = actx.createAnalyser();
  analyser.fftSize = 4096;
  analyser.smoothingTimeConstant = 0.78;
  outGain = actx.createGain();
  outGain.connect(actx.destination);
  preTap = actx.createGain(); // analyzer tap point for Pre
}

function teardownChain(){
  liveOscs.forEach(o => { try { o.stop(); } catch(e){} });
  liveOscs = [];
  liveNodes.forEach(n => { try { n.disconnect(); } catch(e){} });
  liveNodes = [];
  if (source) { try { source.disconnect(); } catch(e){} }
  try { analyser.disconnect(); } catch(e){}
  try { preTap.disconnect(); } catch(e){}
}

function dbToGain(db) { return Math.pow(10, db / 20); }

function applyMix(){
  if (!dryGain || !wetGain || !outGain) return;
  const mix = knobValues[MIX_SLOT] / 100;
  const wet = bypassed ? 0 : (deltaMode ? 1 : mix);
  const dry = bypassed ? 1 : (deltaMode ? 0 : 1 - mix);
  const t = actx.currentTime;
  wetGain.gain.setTargetAtTime(wet, t, 0.02);
  dryGain.gain.setTargetAtTime(dry, t, 0.02);
  outGain.gain.setTargetAtTime(dbToGain((outAmt - 50) / 50 * 12), t, 0.02);
}

/* A live Web-Audio sketch of each macro so the knobs are heard before PROCESS
   renders the real FFmpeg chain. knob i mirrors BACKEND_KNOBS[effect][i]. */
function rebuildChain(){
  if (!actx || !source) return;
  teardownChain();
  const k = knobValues.map(v => v / 100);
  dryGain = actx.createGain(); wetGain = actx.createGain();
  source.connect(preTap);
  source.connect(dryGain); dryGain.connect(outGain);
  wetGain.connect(outGain);
  liveNodes.push(dryGain, wetGain);

  /* preview saturation bias (left fader) — a gentle asymmetric shaper */
  const shaper = actx.createWaveShaper();
  const bias = (biasAmt - 50) / 50; // -1..1
  const curve = new Float32Array(2048);
  for (let i = 0; i < 2048; i++) { const x = (i * 2) / 2048 - 1; curve[i] = Math.tanh((x + bias * 0.25) * 1.4) - Math.tanh(bias * 0.25 * 1.4); }
  shaper.curve = curve; shaper.oversample = '2x';
  liveNodes.push(shaper);

  const echo = (ms, fb) => {
    const d = actx.createDelay(2.0); d.delayTime.value = Math.min(1.99, ms / 1000);
    const g = actx.createGain(); g.gain.value = fb;
    d.connect(g); g.connect(d);
    liveNodes.push(d, g);
    return d;
  };
  const lfo = (hz, depth, target) => {
    const o = actx.createOscillator(); o.frequency.value = hz;
    const g = actx.createGain(); g.gain.value = depth;
    o.connect(g); g.connect(target); o.start();
    liveOscs.push(o); liveNodes.push(g);
  };
  let head = shaper;
  source.connect(head);
  const chain = (...nodes) => { nodes.forEach(n => { head.connect(n); head = n; liveNodes.push(n); }); };

  switch (activeMode) {
    case 'tape': {            // vibrato f=1+wow*5 d=.2+wow*.6 → treble g=-6*tilt @6k → highpass 60
      const vib = actx.createDelay(0.05); vib.delayTime.value = 0.008;
      lfo(1 + k[0] * 5, 0.0004 + k[0] * 0.004, vib.delayTime);
      const tilt = actx.createBiquadFilter(); tilt.type = 'highshelf'; tilt.frequency.value = 6000; tilt.gain.value = -6 * k[1];
      const hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 60;
      chain(vib, tilt, hp); break;
    }
    case 'ghost': {           // afftdn nr → atempo slow-down → aecho 60+size*900ms, .3+size*.4
      const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 6000 - k[0] * 4200; lp.Q.value = 0.5;
      const pitch = actx.createDelay(0.1); pitch.delayTime.value = 0.03;
      lfo(0.3 + k[0] * 0.5, k[0] * 0.01, pitch.delayTime); // slow warble stands in for the tempo drop
      const e = echo(60 + k[1] * 900, 0.3 + k[1] * 0.4);
      chain(lp, pitch, e); break;
    }
    case 'radio': {           // highpass 300+d*400 → lowpass 4000-m*2500 → aecho 20+r*120ms
      const hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 300 + k[0] * 400; hp.Q.value = 0.7;
      const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 4000 - k[1] * 2500; lp.Q.value = 0.7;
      const e = echo(20 + k[2] * 120, 0.2 + k[2] * 0.3);
      chain(hp, lp, e); break;
    }
    case 'alien': {           // vibrato f=4+mod*8 d=.3+mod*.5 → aphaser speed=.2+speed*3
      const vib = actx.createDelay(0.05); vib.delayTime.value = 0.006;
      lfo(4 + k[0] * 8, 0.0006 + k[0] * 0.003, vib.delayTime);
      const ph = actx.createBiquadFilter(); ph.type = 'allpass'; ph.frequency.value = 900; ph.Q.value = 2;
      const ph2 = actx.createBiquadFilter(); ph2.type = 'allpass'; ph2.frequency.value = 1800; ph2.Q.value = 2;
      lfo(0.2 + k[1] * 3, 700, ph.frequency); lfo(0.2 + k[1] * 3, 1400, ph2.frequency);
      chain(vib, ph, ph2); break;
    }
    case 'tunnel': {          // highpass 400 → treble +harsh*6 @3k → aecho 80+d*400 | 120+d*500
      const hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 400;
      const tr = actx.createBiquadFilter(); tr.type = 'highshelf'; tr.frequency.value = 3000; tr.gain.value = k[0] * 6;
      const e1 = echo(80 + k[1] * 400, 0.5), e2 = echo(120 + k[1] * 500, 0.3);
      chain(hp, tr);
      const sum = actx.createGain(); head.connect(e1); head.connect(e2); e1.connect(sum); e2.connect(sum); head.connect(sum);
      liveNodes.push(sum); head = sum; break;
    }
  }
  head.connect(wetGain);
  (analyzerPost ? outGain : preTap).connect(analyser);
  applyMix();
}

/* theDAW host transport: playback start/stop is reported to the parent stage. */
let liveBuf = null;
function postTransportState(playing){
  window.parent.postMessage({ type: 'thedaw-transport-state', playing: playing }, '*');
}
function stopSource(){
  if (!source) return;
  try { source.stop(); } catch(e){}
  source = null;
  postTransportState(false);
}
/* startSource() builds a fresh looping source from the last prepared buffer. A stopped
   loop restarts from zero on the next play, which is acceptable for a loop preview. */
function startSource(){
  if (!liveBuf) return;
  if (source) try { source.stop(); } catch(e){}
  teardownChain();
  source = actx.createBufferSource(); source.buffer = liveBuf; source.loop = true;
  rebuildChain(); source.start();
  postTransportState(true);
}
/* prepareBuf() remembers the buffer without starting playback (host-driven preview). */
function prepareBuf(buf){
  stopSource();
  liveBuf = buf;
}
function connectBuf(buf){
  prepareBuf(buf);
  startSource();
}
async function loadFile(file){
  ensureAudio(); inputFile = file;
  const ab = await file.arrayBuffer();
  inputBuf = await actx.decodeAudioData(ab.slice(0));
  document.getElementById('ain').src = URL.createObjectURL(file);
  connectBuf(inputBuf);
}
/* prepareFile() mirrors loadFile() but leaves playback stopped for the host toggle. */
async function prepareFile(file){
  ensureAudio(); inputFile = file;
  const ab = await file.arrayBuffer();
  inputBuf = await actx.decodeAudioData(ab.slice(0));
  document.getElementById('ain').src = URL.createObjectURL(file);
  prepareBuf(inputBuf);
}
document.getElementById('fileinput').onchange = e => { if (e.target.files[0]) loadFile(e.target.files[0]); };

/* ── SVG ROTARY KNOBS (52px, 270deg sweep) ── */
function renderKnob(idx){
  const svg = document.querySelectorAll('.knob-svg')[idx];
  if (!svg) return;
  const val = knobValues[idx], color = ACCENT;
  const cx = 26, cy = 26, r = 19, tickR = 22;
  const sA = 135, eA = 405, range = eA - sA;
  const ang = sA + (val / 100) * range;
  function pol(a, rad){ const d = (a - 90) * Math.PI / 180; return { x: cx + rad * Math.cos(d), y: cy + rad * Math.sin(d) }; }
  const s = pol(sA, r), v = pol(ang, r);
  const la = (ang - sA) > 180 ? 1 : 0;
  /* tick marks */
  let ticks = '';
  for (let i = 0; i <= 12; i++){
    const ta = sA + (i / 12) * range;
    const p1 = pol(ta, tickR), p2 = pol(ta, tickR + 2);
    const lit = ((ta - sA) / range) <= (val / 100);
    ticks += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="${lit ? color : 'rgba(255,255,255,.06)'}" stroke-width="${lit ? 1 : .6}" stroke-linecap="round" opacity="${lit ? .8 : .3}"/>`;
  }
  svg.innerHTML = `
    <defs>
      <filter id="kg${idx}"><feGaussianBlur stdDeviation="2.5" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <radialGradient id="kf${idx}" cx="50%" cy="40%" r="55%"><stop offset="0" stop-color="#1c2030"/><stop offset="1" stop-color="#0c0f18"/></radialGradient>
    </defs>
    ${ticks}
    <path d="M${pol(sA,r).x},${pol(sA,r).y} A${r},${r} 0 1 1 ${pol(eA,r).x},${pol(eA,r).y}" fill="none" stroke="rgba(255,255,255,.04)" stroke-width="4" stroke-linecap="round"/>
    <path d="M${s.x},${s.y} A${r},${r} 0 ${la} 1 ${v.x},${v.y}" fill="none" stroke="${color}" stroke-width="4" stroke-linecap="round" filter="url(#kg${idx})"/>
    <circle cx="${v.x}" cy="${v.y}" r="2.8" fill="${color}" filter="url(#kg${idx})"/>
    <circle cx="${cx}" cy="${cy}" r="10" fill="url(#kf${idx})" stroke="${color}33" stroke-width="1.2"/>
    <circle cx="${cx}" cy="${cy}" r="6.5" fill="none" stroke="${color}11" stroke-width=".8"/>
    <line x1="${cx}" y1="${cy-1}" x2="${cx+Math.cos((ang-90)*Math.PI/180)*7}" y2="${cy+Math.sin((ang-90)*Math.PI/180)*7}" stroke="${color}cc" stroke-width="1.5" stroke-linecap="round"/>`;
  /* Update value display */
  const cfg = MODES[activeMode];
  const fmt = cfg.fmt[idx] || pct;
  document.getElementById('kv' + idx).textContent = fmt(val);
  kit.sync(svg);
}
function renderAllKnobs(){ for (let i = 0; i < 4; i++) renderKnob(i); }

/* Knob drag + keyboard (module-kit) */
document.querySelectorAll('.knob-svg').forEach(svg => {
  const idx = +svg.dataset.idx;
  kit.slider(svg, {
    min: 0, max: 100, step: 1, wheel: true,
    get: () => knobValues[idx],
    set: v => { knobValues[idx] = v; renderKnob(idx); if (idx === MIX_SLOT) applyMix(); else if (actx && source) rebuildChain(); },
    format: v => (MODES[activeMode].fmt[idx] || pct)(v),
    reset: () => MODES[activeMode].defaults[idx],
    noDblClick: true, // the page's own dblclick handler below resets the slot
  });
  svg.addEventListener('pointerdown', e => {
    knobDrag = { active: true, idx, startY: e.clientY, startVal: knobValues[idx] };
    svg.setPointerCapture(e.pointerId);
    svg.focus({ preventScroll: true });
  });
  svg.addEventListener('pointermove', e => {
    if (!knobDrag.active || +svg.dataset.idx !== knobDrag.idx) return;
    const dy = knobDrag.startY - e.clientY;
    knobValues[knobDrag.idx] = Math.max(0, Math.min(100, knobDrag.startVal + dy * (e.shiftKey ? 0.15 : 0.6)));
    renderKnob(knobDrag.idx);
    if (knobDrag.idx === MIX_SLOT) applyMix(); else if (actx && source) rebuildChain();
  });
  svg.addEventListener('pointerup', () => { knobDrag.active = false; });
  svg.addEventListener('pointercancel', () => { knobDrag.active = false; });
  svg.addEventListener('dblclick', () => { knobValues[idx] = MODES[activeMode].defaults[idx]; renderKnob(idx); if (idx === MIX_SLOT) applyMix(); else if (actx && source) rebuildChain(); });
});
// Keep the knob's aria-label current with the mode's slot name.
function relabelKnobs(){
  document.querySelectorAll('.knob-svg').forEach(svg => {
    const i = +svg.dataset.idx;
    const name = MODES[activeMode].knobs[i];
    if (name) svg.setAttribute('aria-label', name + (i === MIX_SLOT ? ' (preview mix)' : ''));

}

/* ── VERTICAL FADERS (bias / output) ── */
const FADERS = {
  bias: { track: 'biasTrack', fill: 'biasFill', cap: 'biasCap', val: 'biasVal', label: 'Bias (preview saturation)',
          fmt: v => { const db = ((v - 50) / 50 * 6).toFixed(1); return (db >= 0 ? '+' : '') + db + ' dB'; },
          get: () => biasAmt, set: v => { biasAmt = v; if (actx && source) rebuildChain(); }, reset: 50 },
  out:  { track: 'outTrack', fill: 'outFill', cap: 'outCap', val: 'outVal', label: 'Output (preview level)',
          fmt: v => { const db = ((v - 50) / 50 * 12).toFixed(1); return (db >= 0 ? '+' : '') + db + ' dB'; },
          get: () => outAmt, set: v => { outAmt = v; applyMix(); }, reset: 50 },
};
function setFaderVisual(id, v){
  const f = FADERS[id];
  document.getElementById(f.fill).style.height = v + '%';
  document.getElementById(f.cap).style.bottom = v + '%';
  document.getElementById(f.val).textContent = f.fmt(v);
  kit.sync(document.getElementById(f.track));
}
Object.keys(FADERS).forEach(id => {
  const f = FADERS[id];
  const track = document.getElementById(f.track);
  let dragging = false;
  const setFromEvent = e => {
    const rect = track.getBoundingClientRect();
    const v = Math.max(0, Math.min(100, (1 - (e.clientY - rect.top) / rect.height) * 100));
    f.set(v); setFaderVisual(id, v);
  };
  kit.slider(track, { min: 0, max: 100, step: 1, vertical: true, wheel: true, label: f.label, format: f.fmt,
    get: f.get, set: v => { f.set(v); setFaderVisual(id, v); }, reset: f.reset });
  track.addEventListener('pointerdown', e => { dragging = true; track.setPointerCapture(e.pointerId); track.focus({ preventScroll: true }); setFromEvent(e); });
  track.addEventListener('pointermove', e => { if (dragging) setFromEvent(e); });
  track.addEventListener('pointerup', () => { dragging = false; });
  track.addEventListener('pointercancel', () => { dragging = false; });
  setFaderVisual(id, f.get());
});

/* ── SPECTRUM VISUALIZATION ── */
const specCanvas = document.getElementById('specCanvas');
const specZone = document.getElementById('specZone');
let frameCount = 0;

function animateHarmonics(){
  if (!showHarmonics) return;
  const bars = document.querySelectorAll('.harm-bar');
  let energy = 0;
  if (analyser) { analyser.getByteFrequencyData(freqData); energy = Array.from(freqData.slice(0, 64)).reduce((a, b) => a + b, 0) / (64 * 255); }
  bars.forEach((bar, i) => {
    const base = 6 + (8 - i) * 3;
    const live = energy * 20 * Math.random();
    bar.style.height = Math.round(base + live) + 'px';
  });
}

/* Animate SG/SIG meters */
function animateMeters(){
  let energy = 0;
  if (analyser) { analyser.getByteFrequencyData(freqData); energy = Array.from(freqData.slice(0, 128)).reduce((a, b) => a + b, 0) / (128 * 255); }
  const sg = document.getElementById('sgFill');
  const sig = document.getElementById('sigFill');
  if (sg) sg.style.height = Math.round(15 + energy * 70) + '%';
  if (sig) sig.style.height = Math.round(20 + energy * 65) + '%';
}

function draw(){
  requestAnimationFrame(draw);
  frameCount++;
  const W = specZone.clientWidth, H = specZone.clientHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (specCanvas.width !== W * dpr || specCanvas.height !== H * dpr) { specCanvas.width = W * dpr; specCanvas.height = H * dpr; }
  const ctx = specCanvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  /* Background */
  ctx.fillStyle = '#040610';
  ctx.fillRect(0, 0, W, H);

  /* Grid lines */
  ctx.strokeStyle = 'rgba(255,255,255,.03)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i < 7; i++){
    const y = (i / 6) * H;
    ctx.beginPath(); ctx.moveTo(28, y); ctx.lineTo(W - 24, y); ctx.stroke();
  }
  const freqs = [20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000];
  freqs.forEach(f => {
    const ratio = Math.log10(f / 20) / Math.log10(1000);
    const x = 28 + ratio * (W - 52);
    if (x > 28 && x < W - 24) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
  });

  if (!analyser) {
    const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.4);
    g.addColorStop(0, 'rgba(245,158,11,.02)'); g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,.04)'; ctx.font = '9px "IBM Plex Mono"'; ctx.textAlign = 'center';
    ctx.fillText('Load audio to view spectrum', W / 2, H / 2);
    return;
  }

  analyser.getByteFrequencyData(freqData);
  analyser.getFloatTimeDomainData(timeData);
  const bins = freqData.length;

  ctx.beginPath();
  ctx.moveTo(28, H);
  for (let i = 0; i < bins * 0.75; i++){
    const ratio = Math.log10(1 + (i / (bins * 0.75)) * 999) / 3;
    const x = 28 + ratio * (W - 52);
    const val = freqData[i] / 255;
    const y = H - val * H * 0.85;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.lineTo(W - 24, H); ctx.lineTo(28, H);
  ctx.closePath();
  const fillGrad = ctx.createLinearGradient(0, 0, 0, H);
  fillGrad.addColorStop(0, 'rgba(245,158,11,.12)');
  fillGrad.addColorStop(1, 'rgba(245,158,11,.01)');
  ctx.fillStyle = fillGrad; ctx.fill();

  ctx.beginPath();
  for (let i = 0; i < bins * 0.75; i++){
    const ratio = Math.log10(1 + (i / (bins * 0.75)) * 999) / 3;
    const x = 28 + ratio * (W - 52);
    const val = freqData[i] / 255;
    const y = H - val * H * 0.85;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.strokeStyle = ACCENT; ctx.lineWidth = 1.5; ctx.shadowColor = ACCENT; ctx.shadowBlur = 6; ctx.stroke();
  ctx.shadowBlur = 0;

  if (showHarmonics) {
    ctx.beginPath();
    for (let i = 0; i < bins * 0.75; i++){
      const ratio = Math.log10(1 + (i / (bins * 0.75)) * 999) / 3;
      const x = 28 + ratio * (W - 52);
      const harmBoost = Math.sin(i * 0.15) * 0.15 + 0.1;
      const val = (freqData[i] / 255) * (1 + harmBoost);
      const y = H - Math.min(1, val) * H * 0.85;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = 'rgba(245,158,11,.6)'; ctx.lineWidth = 2.5; ctx.shadowColor = ACCENT; ctx.shadowBlur = 12; ctx.stroke();
    ctx.shadowBlur = 0;
  }

  const tg = ctx.createLinearGradient(0, H * 0.6, 0, H);
  tg.addColorStop(0, 'transparent');
  tg.addColorStop(1, 'rgba(245,158,11,.04)');
  ctx.fillStyle = tg; ctx.fillRect(0, H * 0.6, W, H * 0.4);

  animateHarmonics();
  animateMeters();
}
draw();

/* The footer <audio> previews join the host transport protocol. */
const ainEl = document.getElementById('ain');
const aoutEl = document.getElementById('aout');
function previewStillAudible() {
  if (source) return true;
  if (ainEl && !ainEl.paused && !ainEl.ended) return true;
  if (aoutEl && !aoutEl.paused && !aoutEl.ended) return true;
  return false;
}
[ainEl, aoutEl].forEach((el) => {
  if (!el) return;
  el.addEventListener('play', () => postTransportState(true));
  el.addEventListener('pause', () => postTransportState(previewStillAudible()));
  el.addEventListener('ended', () => postTransportState(previewStillAudible()));
});

// ── Receive audio + transport from parent page ──
window.addEventListener('message', async (e) => {
  if (e.data && e.data.type === 'thedaw-audio' && e.data.buffer) {
    try {
      const blob = new Blob([e.data.buffer], { type: 'audio/wav' });
      const file = new File([blob], e.data.name || 'track.wav', { type: 'audio/wav' });
      // Host-supplied audio loads paused; the stage's transport toggle starts it.
      if (typeof prepareFile === 'function') { prepareFile(file); }
      else {
        const ain = document.getElementById('ain') || document.querySelector('audio');
        if (ain) { ain.src = URL.createObjectURL(blob); }
      }
    } catch(err) { console.warn('postMessage audio load failed:', err); }
  }
  if (e.data && e.data.type === 'thedaw-transport') {
    if (e.data.action === 'play') {
      if (actx && actx.state === 'suspended') actx.resume();
      if (ainEl) ainEl.pause();
      if (aoutEl) aoutEl.pause();
      startSource();
    } else if (e.data.action === 'pause') {
      stopSource();
      if (ainEl) ainEl.pause();
      if (aoutEl) aoutEl.pause();
    }
  }
});

/* ── INIT ── */
setMode('tape');
kit.toggleGroup('.mode-pill', 'active', true);
</script>
