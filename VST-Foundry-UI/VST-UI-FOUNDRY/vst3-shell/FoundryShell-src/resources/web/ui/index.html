<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FoundryShell</title>
  <style>
    :root {
      --bg: #14171c;
      --panel: #1c2129;
      --border: #2c333d;
      --text: #e7ecf3;
      --muted: #8b95a4;
      --accent: #4c8dff;
    }
    * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 26px;
      text-align: center;
    }
    h1 { margin: 0 0 6px; font-size: 22px; font-weight: 700; }
    .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .knob-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    label { font-size: 13px; color: var(--muted); }
    input[type="range"] { width: 240px; accent-color: var(--accent); }
    .value { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--text); }
    .hint {
      margin-top: 22px;
      padding: 12px;
      border: 1px dashed var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    code { color: var(--accent); }
  </style>
  <!-- Reusable native<->web bridge. Injects window.foundryHost etc. -->
  <script src="foundry-bridge.js"></script>
</head>
<body>
  <main class="card">
    <h1>FoundryShell</h1>
    <p class="sub" id="status">Generic Foundry WebView host &mdash; no bundle UI loaded.</p>

    <div class="knob-wrap">
      <label for="testknob" id="testlabel">Parameter 0</label>
      <input type="range" id="testknob" name="testknob" min="0" max="1" step="0.001" value="0" />
      <div class="value" id="testvalue">0.000</div>
    </div>

    <p class="hint">
      Drop a Foundry export (<code>manifest.json</code> + <code>ui/</code>) into this
      plugin's <code>Contents/Resources/</code> folder, then reload the plugin.
    </p>
  </main>

  <script>
    (function () {
      "use strict";
      var knob = document.getElementById("testknob");
      var valueEl = document.getElementById("testvalue");
      var labelEl = document.getElementById("testlabel");
      var statusEl = document.getElementById("status");

      // The first manifest parameter (index 0). Bound once the native side
      // pushes the parameter map.
      var boundParamId = null;

      window.onFoundryParamMap = function (map) {
        if (map && map.length > 0) {
          boundParamId = map[0].id;
          labelEl.textContent = "Parameter 0 (" + boundParamId + ")";
          statusEl.textContent = map.length + " parameter(s) from manifest.";
        }
      };

      // Push value to the plugin as the user drags the test knob.
      knob.addEventListener("input", function () {
        var v = parseFloat(knob.value);
        valueEl.textContent = v.toFixed(3);
        if (boundParamId !== null) {
          window.foundryHost.setParam(boundParamId, v);
        }
      });

      // React to host automation / preset recall for parameter 0.
      window.foundryApplyParam = function (id, normalized) {
        if (boundParamId !== null && id === boundParamId) {
          knob.value = normalized;
          valueEl.textContent = Number(normalized).toFixed(3);
        }
      };
    })();
  </script>
</body>
</html>
