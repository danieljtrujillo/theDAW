appId: com.gantasmo.thedaw
productName: theDAW
copyright: Copyright (c) 2026 GANTASMO
directories:
  output: release
  # buildResources holds resources/icon.png (1024x1024), which electron-builder
  # discovers automatically and converts to .ico for Windows and .icns for
  # macOS, so no explicit win.icon / mac.icon keys are needed.
  buildResources: resources

# Register theDAW as the handler for its file types so double-clicking a project
# or plugin opens it in the app (the main process reads the path from argv and
# routes it to the renderer). Developer/company is GANTASMO.
fileAssociations:
  - ext: tasmo
    name: theDAW Project
    description: theDAW project
    role: Editor
  - ext: gan
    name: GAN Plugin
    description: GANTASMO .gan web plugin
    role: Editor

# The Electron shell itself ships only the built renderer + main/preload bundles.
# Everything Python lives beside the app under resources/ (see extraResources)
# and is installed on first launch by the bundled uv. Keeping the Python source
# out of the asar keeps it on a real filesystem path that uv + the spawned
# backend can read and write (the venv is created next to pyproject.toml).
files:
  - out/**/*

# Thin-bootstrap payload. None of this is a virtualenv or model weights; it is
# the source tree plus the two native binaries the first-run bootstrap needs.
# uv pulls a managed CPython 3.10 and every dependency itself, so the target
# machine needs nothing pre-installed.
extraResources:
  - from: ../backend
    to: python/backend
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.py[cod]"
      - "!rag_index/**"
      # Machine-local Python venvs created at runtime (the whisper
      # transcription sidecar builds .whisper_venv next to its module) must
      # never ship: they hard-code absolute host paths and add ~300MB the
      # target machine rebuilds for itself on first use.
      - "!**/.whisper_venv/**"
      - "!**/.venv/**"
      # uv's package cache (kept on the repo drive by theDAW.bat for fast
      # same-drive hardlinks) is a multi-GB runtime artifact, never shipped.
      - "!**/.uv-cache/**"
  - from: ../stable_audio_3
    to: python/stable_audio_3
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.py[cod]"
  - from: ../pyproject.toml
    to: python/pyproject.toml
  - from: ../uv.lock
    to: python/uv.lock
  - from: ../.python-version
    to: python/.python-version
  - from: ../README.md
    to: python/README.md
  - from: ../docs
    to: python/docs
    filter:
      - "**/*.md"
      # Internal developer working-notes are not user documentation, so they
      # must never ship in the installer.
      - "!plans/**"
      - "!audits/**"
      - "!changes/**"
      - "!reports/**"
      - "!in-flight-work.md"
      - "!WHERE-WE-STAND.md"
  - from: ../frontend/public/USER_GUIDE.md
    to: python/frontend/public/USER_GUIDE.md
  # Static VJ (gantasmo/VJ-9000) production build, staged by scripts/fetch-vj-build.mjs
  # (npm run fetch:vj) before packaging. Lands at python/vj-dist, which the backend's
  # VJ sidecar resolves as _REPO_ROOT/"vj-dist" and mounts at /vj-app — so the VJ tab
  # works with no Node.js on the target machine. The dir is gitignored + regenerated.
  - from: resources/vj-dist
    to: python/vj-dist
    filter:
      - "**/*"
  # VST Foundry production bundle (dist/ + production node_modules + package.json),
  # staged by scripts/fetch-foundry-build.mjs (npm run fetch:foundry). Lands where the
  # foundry sidecar resolves it (_REPO_ROOT/"VST-Foundry-UI"/"VST-UI-FOUNDRY") and runs
  # `node dist/server.cjs` with the bundled node (resources/tools/node). Foundry is a
  # fullstack Node app, so unlike VJ it ships its whole runtime. Gitignored + regenerated.
  - from: resources/foundry-app
    to: python/VST-Foundry-UI/VST-UI-FOUNDRY
    filter:
      - "**/*"
  # uv + ffmpeg + ffprobe, downloaded by scripts/fetch-runtime-tools.mjs before
  # the build. Prepended to the spawned backend's PATH at runtime. The contents
  # are HOST-PLATFORM-SPECIFIC (Windows: uv.exe/ffmpeg.exe/ffprobe.exe, macOS:
  # uv/ffmpeg/ffprobe), so a Windows installer must be built on Windows and a
  # mac dmg on macOS with a freshly fetched tools dir.
  - from: resources/tools
    to: tools
    filter:
      - "**/*"
  # Explorer right-click "Convert with theDAW" helper (registered by
  # resources/installer.nsh). Lands at <install>\resources\convert-with-thedaw.ps1
  # and resolves the bundled ffmpeg at .\tools\ffmpeg.exe.
  - from: resources/convert-with-thedaw.ps1
    to: convert-with-thedaw.ps1

win:
  target:
    - nsis
  # artifactName keeps the installer name stable for release uploads.
  artifactName: theDAW-Setup-${version}.${ext}

nsis:
  # Per-user install (no elevation). Lands under %LOCALAPPDATA%\Programs\theDAW,
  # which is writable, so uv can build the venv there and the backend can write
  # its data/ tree without admin rights.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # The first launch downloads ~3-5 GB of Python + CUDA wheels and the model
  # weights, so the uninstaller leaves user data in place unless asked.
  deleteAppDataOnUninstall: false

mac:
  # Apple Silicon only. uv.lock resolves torch for darwin exclusively as an
  # arm64 wheel (macosx_11_0_arm64); there is no darwin x64 torch wheel, so an
  # Intel build could never bootstrap its Python env on first launch.
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.music
  artifactName: theDAW-${version}-${arch}.${ext}

linux:
  target:
    - AppImage
  category: Audio
